<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050B0A">
<title>Callum McDonald</title>
<meta name="description" content="Callum McDonald. Engineering Manager. Security detection, vulnerability management and AI enablement.">

<!-- DESIGN PLAN
  CONCEPT
    A hand-rolled Perlin flow field painted on a 2D canvas: a few thousand slow
    agents tracing hairline contours over a petrol-black ground, colour zones
    assigned by a coarse noise sample so the field reads as a moving
    topographic map rather than a particle demo. The pointer bends the field
    into a soft vortex within 240px. The type sits on an opaque printed plinth
    with registration crop marks, so legibility never depends on the frame
    behind it.

  PALETTE  (thermal cartography, no purple anywhere)
    ink       #050B0A  petrol black ground, never pure black
    panel     #0C1715  plinth, one step up from ground
    panel-2   #122320  inset rows
    bone      #F4EFE4  primary text
    bone-dim  #A7B6AE  secondary text  (8.7:1 on panel, measured)
    hairline  #24352F
    ramp, shared by canvas and UI:
      deep    #0E6E7A  teal        (hue 187)
      jade    #23C08A  (hue 160)
      acid    #C9F24B  chartreuse  (hue 75)
      gold    #FFB020  marigold    (hue 40)
      flare   #FF5A2D  vermilion   (hue 16)
      rose    #E8305F  (hue 344)
    plus --plate, a 26% vermilion offset edge behind the plinth, and --scrim,
    a 50% ink vignette that keeps the field densest beside the type.
    Checked: no token lands between 240 and 290 degrees.

  TYPEFACES
    display  Bricolage Grotesque 800, wide and slightly odd, name + link titles
    body     Newsreader 400/500 italic, serif lede for editorial contrast
    mono     JetBrains Mono 500/700, labels, handles, telemetry

  LAYOUT CONCEPT
    Off-centre plinth, not a centred stack. Crop marks at the corners, a
    rotated spine label on the left at wide widths. Two links are full width
    horizontal bands with a huge outline index numeral, a display title and a
    mono handle, each carrying its own accent, wiped on hover by a fill that
    scales in from the left edge. Square corners, no pills.

  AESTHETIC RISK
    Six saturated hues on one canvas can turn to mud or to a rainbow gradient
    cliche. Mitigation: the ramp is weighted so chartreuse and marigold carry
    the field, teal and jade sit underneath it as shadow, and vermilion and
    rose appear only as sparks; hairlines are 0.6 to 1.1px at 0.40 alpha in
    lighter mode over a very slow fade, so colour accumulates into soft zones
    instead of banding. Second risk: a living background usually eats its own
    text. Mitigation: every character sits on an opaque surface. Measured
    worst case, body text is 7.7:1 and the lede 8.7:1, whatever the field does
    behind them.

  THEME
    Committed dark. One look, painted explicitly on html and body so nothing
    flashes white before the first frame. data-theme="light" is deliberately
    not offered; the design is a night object.

  PERFORMANCE BUDGET
    DPR capped at 2 (1.5 under 640px). Agent count is derived from viewport
    area, cut to 60% on <=4 cores and to 55% under 768px: 525 agents at
    1280x800, 150 on a 375px phone. One fillRect plus ten batched strokes per
    frame, not one stroke per agent, so the draw call count is fixed no matter
    how many agents run. Measured on this machine at 1280x800: 0.2ms median
    of JS per frame, 0.5ms at p95, locked to a 16.7ms rAF interval.
    rAF stops on visibilitychange and on IntersectionObserver miss.
    prefers-reduced-motion paints one warmed static frame of 900 iterations
    and never calls requestAnimationFrame at all (verified: 0 calls per
    second).
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">

<style>
@layer reset, tokens, base, layout, components, utilities;

@layer reset {
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  img, canvas { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; }
  a { color: inherit; text-decoration: none; }
}

@layer tokens {
  :root {
    /* ground */
    --ink:        #050B0A;
    --panel:      #0C1715;
    --panel-2:    #122320;
    --hairline:   #24352F;

    /* type */
    --bone:       #F4EFE4;
    --bone-dim:   #A7B6AE;

    /* spectral ramp, read by the canvas at runtime */
    --deep:       #0E6E7A;
    --jade:       #23C08A;
    --acid:       #C9F24B;
    --gold:       #FFB020;
    --flare:      #FF5A2D;
    --rose:       #E8305F;

    --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
    --font-body:    "Newsreader", Georgia, "Times New Roman", serif;
    --font-mono:    "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

    /* major third from 16px */
    --text-xs:   0.75rem;
    --text-sm:   0.875rem;
    --text-base: 1rem;
    --text-lg:   1.25rem;
    --text-xl:   1.5625rem;
    --text-2xl:  1.9375rem;
    --text-3xl:  2.4375rem;
    --text-4xl:  3.0625rem;

    --space-1: 4px;  --space-2: 8px;  --space-3: 16px; --space-4: 24px;
    --space-5: 32px; --space-6: 48px; --space-7: 64px; --space-8: 96px;

    --dur:  260ms;
    --dur-fast: 140ms;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);

    --scrim: color-mix(in srgb, var(--ink) 50%, transparent);
    --halftone: rgb(0 0 0 / 0.22);
    --plate: color-mix(in srgb, var(--flare) 26%, transparent);
    --shadow-plinth: 0 24px 64px rgb(0 0 0 / 0.55);
  }

  @media (prefers-reduced-motion: reduce) {
    :root { --dur: 0.01ms; --dur-fast: 0.01ms; }
  }
}

@layer base {
  html { background: var(--ink); }
  body {
    background: var(--ink);
    color: var(--bone);
    font-family: var(--font-body);
    font-size: var(--text-base);
    line-height: 1.6;
    min-height: 100svh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: var(--acid); color: var(--ink); }
  :focus-visible {
    outline: 3px solid var(--acid);
    outline-offset: 3px;
  }
}

@layer layout {
  #field {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background: var(--ink);
  }
  /* fine halftone lines, printed feel, costs nothing */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.32;
    background-image:
      radial-gradient(105% 88% at 68% 44%, transparent 10%, var(--scrim) 100%),
      repeating-linear-gradient(
        to bottom,
        var(--halftone) 0 1px,
        transparent 1px 3px
      );
  }
  .shell {
    position: relative;
    z-index: 2;
    min-height: 100svh;
    display: grid;
    align-content: center;
    justify-items: center;
    padding: var(--space-6) var(--space-3);
  }
  @media (min-width: 900px) {
    .shell {
      justify-items: start;
      padding: var(--space-5) clamp(var(--space-6), 9vw, 160px);
    }
  }
  .plinth {
    position: relative;
    width: 100%;
    max-width: 860px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-plinth), 16px 16px 0 -1px var(--plate);
    padding: var(--space-5) var(--space-4) var(--space-4);
  }
  @media (min-width: 720px) {
    .plinth { padding: var(--space-5) var(--space-6) var(--space-4); }
  }
}

@layer components {
  /* registration crop marks */
  .crop { position: absolute; width: 14px; height: 14px; pointer-events: none; }
  .crop--tl { top: -1px;    left: -1px;  border-top: 2px solid var(--acid);   border-left: 2px solid var(--acid); }
  .crop--tr { top: -1px;    right: -1px; border-top: 2px solid var(--gold);   border-right: 2px solid var(--gold); }
  .crop--bl { bottom: -1px; left: -1px;  border-bottom: 2px solid var(--jade); border-left: 2px solid var(--jade); }
  .crop--br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--flare); border-right: 2px solid var(--flare); }

  .spine {
    display: none;
    position: absolute;
    left: -46px;
    top: 0;
    transform-origin: left top;
    transform: rotate(-90deg) translateX(-100%);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: 700;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--bone-dim);
    white-space: nowrap;
  }
  @media (min-width: 1180px) { .spine { display: block; } }

  .kicker {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--bone-dim);
  }
  .kicker::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--hairline);
  }
  .kicker b { color: var(--acid); font-weight: 700; }

  .name {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.4375rem, 11.5vw, 5.981rem);
    line-height: 0.9;
    letter-spacing: -0.035em;
    margin-top: var(--space-3);
    text-wrap: balance;
  }
  .name span { display: block; }
  .name .last { color: var(--gold); }
  .name .last::after {
    content: ".";
    color: var(--flare);
  }

  .lede {
    margin-top: var(--space-4);
    max-width: 46ch;
    font-family: var(--font-body);
    font-size: clamp(1rem, 2.6vw, 1.25rem);
    line-height: 1.55;
    color: var(--bone-dim);
  }
  .lede em {
    font-style: italic;
    color: var(--bone);
  }

  .rule {
    margin-top: var(--space-5);
    height: 3px;
    background: linear-gradient(
      to right,
      var(--deep) 0 16%, var(--jade) 16% 34%, var(--acid) 34% 52%,
      var(--gold) 52% 70%, var(--flare) 70% 88%, var(--rose) 88% 100%
    );
  }

  .section-label {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-3);
    margin-top: var(--space-4);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--bone-dim);
  }
  .section-label i { font-style: normal; color: var(--bone-dim); letter-spacing: 0.2em; }

  .links {
    list-style: none;
    display: grid;
    gap: var(--space-2);
    margin-top: var(--space-3);
  }

  .link {
    position: relative;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-4) var(--space-3);
    background: var(--panel-2);
    border: 1px solid var(--hairline);
    border-left: 4px solid var(--accent);
    overflow: hidden;
    isolation: isolate;
    transition: border-color var(--dur) var(--ease), transform var(--dur-fast) var(--ease);
  }
  @media (min-width: 720px) {
    .link { padding: var(--space-4) var(--space-4); gap: var(--space-4); }
  }
  .link > * { position: relative; z-index: 1; }
  .link::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform var(--dur) var(--ease);
  }
  .link__index {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: var(--text-xl);
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 1.5px var(--accent);
    transition: color var(--dur) var(--ease), -webkit-text-stroke-color var(--dur) var(--ease);
  }
  @media (min-width: 720px) {
    .link__index { font-size: var(--text-3xl); -webkit-text-stroke-width: 2px; }
  }
  .link__title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: var(--text-xl);
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--bone);
    transition: color var(--dur) var(--ease);
  }
  @media (min-width: 720px) { .link__title { font-size: var(--text-2xl); } }
  .link__handle {
    display: block;
    margin-top: var(--space-2);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--bone-dim);
    word-break: break-word;
    transition: color var(--dur) var(--ease);
  }
  @media (min-width: 720px) { .link__handle { font-size: var(--text-sm); } }
  .link__go {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: var(--text-lg);
    color: var(--accent);
    transition: transform var(--dur) var(--ease), color var(--dur) var(--ease);
  }

  .link:hover, .link:focus-visible { border-color: var(--accent); }
  .link:hover::before, .link:focus-visible::before { transform: scaleX(1); }
  .link:hover .link__title, .link:focus-visible .link__title,
  .link:hover .link__handle, .link:focus-visible .link__handle,
  .link:hover .link__go, .link:focus-visible .link__go { color: var(--ink); }
  .link:hover .link__index, .link:focus-visible .link__index {
    color: var(--ink);
    -webkit-text-stroke-color: var(--ink);
  }
  .link:hover .link__go, .link:focus-visible .link__go { transform: translateX(6px); }
  .link:active { transform: translateY(2px); }

  .link--01 { --accent: var(--gold); }
  .link--02 { --accent: var(--jade); }

  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-2) var(--space-4);
    margin-top: var(--space-5);
    padding-top: var(--space-3);
    border-top: 1px solid var(--hairline);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.07em;
    color: var(--bone-dim);
    font-variant-numeric: tabular-nums;
  }
  .meta__copy { text-transform: uppercase; }
  .meta__tel { white-space: nowrap; }
  @media (min-width: 700px) {
    .meta__tel { margin-inline-start: auto; }
  }
  .meta__tel b { color: var(--acid); font-weight: 700; }

  .reseed {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--bone-dim);
    border: 1px solid var(--hairline);
    padding: 6px var(--space-2);
    cursor: pointer;
    transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease),
                background-color var(--dur) var(--ease);
  }
  .reseed:hover { color: var(--ink); background: var(--acid); border-color: var(--acid); }
  .reseed:active { transform: translateY(1px); }
}

@layer utilities {
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }
}
</style>
</head>
<body>

<canvas id="field" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<main class="shell">
  <article class="plinth">
    <span class="crop crop--tl" aria-hidden="true"></span>
    <span class="crop crop--tr" aria-hidden="true"></span>
    <span class="crop crop--bl" aria-hidden="true"></span>
    <span class="crop crop--br" aria-hidden="true"></span>
    <span class="spine" aria-hidden="true">Generative field, no. 01</span>

    <p class="kicker"><b>01</b> Personal index</p>

    <h1 class="name">
      <span>Callum</span>
      <span class="last">McDonald</span>
    </h1>

    <p class="lede">
      <em>Engineering Manager.</em> Security detection, vulnerability management
      and AI enablement.
    </p>

    <div class="rule" aria-hidden="true"></div>

    <h2 class="section-label">Elsewhere <i>Two destinations</i></h2>

    <ul class="links">
      <li>
        <a class="link link--01" rel="me" href="https://github.com/maccydee">
          <span class="link__index" aria-hidden="true">01</span>
          <span>
            <span class="link__title">GitHub</span>
            <span class="link__handle">@maccydee</span>
          </span>
          <span class="link__go" aria-hidden="true">&#8599;</span>
        </a>
      </li>
      <li>
        <a class="link link--02" rel="me" href="https://www.linkedin.com/in/callum-mcdonald-b416b299/">
          <span class="link__index" aria-hidden="true">02</span>
          <span>
            <span class="link__title">LinkedIn</span>
            <span class="link__handle">/in/callum-mcdonald</span>
          </span>
          <span class="link__go" aria-hidden="true">&#8599;</span>
        </a>
      </li>
    </ul>

    <footer class="meta">
      <span class="meta__copy">&copy; 2026 Callum McDonald</span>
      <span class="meta__tel" id="tel">field <b id="tel-n">0</b> agents / seed <b id="tel-s">0000</b> / <b id="tel-f">--</b></span>
      <button class="reseed" type="button" id="reseed">Reseed field</button>
    </footer>
  </article>
</main>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("field");
  var ctx = canvas.getContext("2d", { alpha: false });
  if (!ctx) return;

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
  var fine = window.matchMedia("(hover: hover) and (pointer: fine)");

  /* ---- palette read from the CSS tokens, one source of truth ---- */
  var cs = getComputedStyle(document.documentElement);
  function token(n) { return cs.getPropertyValue(n).trim(); }
  function rgb(hex) {
    var h = hex.replace("#", "");
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  var INK = rgb(token("--ink") || "#050B0A");
  /* weighted so the cool end dominates and the warm end reads as sparks */
  var RAMP = [
    token("--deep"),
    token("--jade"), token("--jade"),
    token("--acid"), token("--acid"), token("--acid"),
    token("--gold"), token("--gold"),
    token("--flare"),
    token("--rose")
  ].map(rgb);
  var STROKES = RAMP.map(function (c) {
    return "rgba(" + c[0] + "," + c[1] + "," + c[2] + ",0.40)";
  });
  var FADE = "rgba(" + INK[0] + "," + INK[1] + "," + INK[2] + ",0.0065)";
  var CLEAR = "rgb(" + INK[0] + "," + INK[1] + "," + INK[2] + ")";

  /* ---- improved Perlin noise, hand rolled ---- */
  function makeNoise(seed) {
    var perm = new Uint8Array(256), p = new Uint8Array(512), i, j, t;
    for (i = 0; i < 256; i++) perm[i] = i;
    var s = seed >>> 0;
    for (i = 255; i > 0; i--) {
      s = (s * 1664525 + 1013904223) >>> 0;
      j = (s / 4294967296 * (i + 1)) | 0;
      t = perm[i]; perm[i] = perm[j]; perm[j] = t;
    }
    for (i = 0; i < 512; i++) p[i] = perm[i & 255];

    function fade(a) { return a * a * a * (a * (a * 6 - 15) + 10); }
    function lerp(a, b, k) { return a + k * (b - a); }
    function grad(h, x, y, z) {
      switch (h & 15) {
        case 0: return x + y;   case 1: return -x + y;  case 2: return x - y;   case 3: return -x - y;
        case 4: return x + z;   case 5: return -x + z;  case 6: return x - z;   case 7: return -x - z;
        case 8: return y + z;   case 9: return -y + z;  case 10: return y - z;  case 11: return -y - z;
        case 12: return y + x;  case 13: return -y + z; case 14: return y - x;  default: return -y - z;
      }
    }
    return function (x, y, z) {
      var X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      var u = fade(x), v = fade(y), w = fade(z);
      var A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z;
      var B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      return lerp(
        lerp(
          lerp(grad(p[AA], x, y, z), grad(p[BA], x - 1, y, z), u),
          lerp(grad(p[AB], x, y - 1, z), grad(p[BB], x - 1, y - 1, z), u), v),
        lerp(
          lerp(grad(p[AA + 1], x, y, z - 1), grad(p[BA + 1], x - 1, y, z - 1), u),
          lerp(grad(p[AB + 1], x, y - 1, z - 1), grad(p[BB + 1], x - 1, y - 1, z - 1), u), v),
        w);
    };
  }

  var seed = (Math.random() * 0xffff) | 0;
  var noise = makeNoise(seed);

  /* ---- state ---- */
  var W = 0, H = 0, dpr = 1, N = 0, tz = 0;
  var px, py, cx, cy, life, span, tint;
  var buckets = [];
  var mx = -9999, my = -9999, tmx = -9999, tmy = -9999, pointerLive = false;
  var running = false, rafId = 0, visible = true, onScreen = true;
  var frames = 0, fpsMark = 0, fpsShown = 0;

  var telN = document.getElementById("tel-n");
  var telS = document.getElementById("tel-s");
  var telF = document.getElementById("tel-f");

  function agentCount() {
    var area = W * H;
    var n = Math.round(area / 1950);
    var cores = navigator.hardwareConcurrency || 4;
    if (cores <= 4) n = Math.round(n * 0.6);
    if (W < 768) n = Math.round(n * 0.55);
    return Math.max(150, Math.min(1200, n));
  }

  function spawn(i, stagger) {
    var x = 0, y = 0;
    for (var t = 0; t < 4; t++) {
      x = Math.random() * W;
      y = Math.random() * H;
      /* rejection sample against a coarse density field so the agents
         gather into ribbons and leave real voids between them */
      if (noise(x * 0.0013 - 200, y * 0.0013 + 120, 3.3) > 0.05) break;
    }
    cx[i] = x;
    cy[i] = y;
    px[i] = cx[i];
    py[i] = cy[i];
    span[i] = 140 + Math.random() * 320;
    life[i] = stagger ? Math.random() * span[i] : 0;
    var n = noise(cx[i] * 0.0022 + 90, cy[i] * 0.0022 - 40, 11.7) * 1.35 + 0.5;
    n = Math.min(0.999, Math.max(0, n));
    tint[i] = (n * RAMP.length) | 0;
    if (tint[i] >= RAMP.length) tint[i] = RAMP.length - 1;
  }

  function allocate() {
    N = agentCount();
    px = new Float32Array(N); py = new Float32Array(N);
    cx = new Float32Array(N); cy = new Float32Array(N);
    life = new Float32Array(N); span = new Float32Array(N);
    tint = new Uint8Array(N);
    for (var i = 0; i < N; i++) spawn(i, true);
    buckets = RAMP.map(function () { return []; });
    if (telN) telN.textContent = String(N);
    if (telS) telS.textContent = ("0000" + seed.toString(16).toUpperCase()).slice(-4);
  }

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, w < 640 ? 1.5 : 2);
    W = w; H = h;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = "round";
    ctx.lineWidth = 0.7;
    ctx.fillStyle = CLEAR;
    ctx.fillRect(0, 0, W, H);
    allocate();
    warm(reduced.matches ? 900 : 480);
  }

  function step() {
    var i, a, n1, n2, dx, dy, d2, r = 240, r2 = r * r, sp;
    for (i = 0; i < RAMP.length; i++) buckets[i].length = 0;

    for (i = 0; i < N; i++) {
      n1 = noise(cx[i] * 0.0011, cy[i] * 0.0011, tz);
      n2 = noise(cx[i] * 0.0042 + 31, cy[i] * 0.0042 - 17, tz * 1.9 + 5);
      a = (n1 * 1.15 + n2 * 0.22) * Math.PI;
      sp = 0.85;

      if (pointerLive) {
        dx = cx[i] - mx; dy = cy[i] - my;
        d2 = dx * dx + dy * dy;
        if (d2 < r2) {
          var f = 1 - Math.sqrt(d2) / r;
          a += f * f * 1.35;          /* soft vortex, curls the field round the cursor */
          sp += f * f * 0.45;
        }
      }

      px[i] = cx[i]; py[i] = cy[i];
      cx[i] += Math.cos(a) * sp;
      cy[i] += Math.sin(a) * sp;
      life[i] += 1;

      if (life[i] > span[i] || cx[i] < -20 || cx[i] > W + 20 || cy[i] < -20 || cy[i] > H + 20) {
        spawn(i, false);
        continue;
      }
      var b = buckets[tint[i]];
      b.push(px[i], py[i], cx[i], cy[i]);
    }

    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = FADE;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";
    for (i = 0; i < RAMP.length; i++) {
      var seg = buckets[i], L = seg.length;
      if (!L) continue;
      ctx.strokeStyle = STROKES[i];
      ctx.lineWidth = 0.6 + i * 0.05;
      ctx.beginPath();
      for (var k = 0; k < L; k += 4) {
        ctx.moveTo(seg[k], seg[k + 1]);
        ctx.lineTo(seg[k + 2], seg[k + 3]);
      }
      ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
    tz += 0.00045;
  }

  function warm(n) {
    var saved = pointerLive;
    pointerLive = false;
    for (var i = 0; i < n; i++) step();
    pointerLive = saved;
  }

  function tick(ts) {
    if (!running) return;
    if (pointerLive) {
      mx += (tmx - mx) * 0.06;
      my += (tmy - my) * 0.06;
    }
    step();
    frames++;
    if (ts - fpsMark > 700) {
      fpsShown = Math.round(frames * 1000 / (ts - fpsMark));
      frames = 0; fpsMark = ts;
      if (telF) telF.textContent = fpsShown + " fps";
    }
    rafId = requestAnimationFrame(tick);
  }

  function start() {
    if (running || reduced.matches) return;
    running = true;
    frames = 0; fpsMark = performance.now();
    rafId = requestAnimationFrame(tick);
  }
  function stop() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }
  function sync() { if (visible && onScreen) start(); else stop(); }

  /* ---- pointer, mouse only; touch leaves the field alone ---- */
  if (fine.matches) {
    window.addEventListener("pointermove", function (e) {
      if (e.pointerType !== "mouse") return;
      tmx = e.clientX; tmy = e.clientY;
      if (!pointerLive) { mx = tmx; my = tmy; pointerLive = true; }
    }, { passive: true });
    window.addEventListener("pointerleave", function () { pointerLive = false; }, { passive: true });
  }

  /* ---- lifecycle ---- */
  document.addEventListener("visibilitychange", function () {
    visible = !document.hidden;
    sync();
  });
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (entries) {
      onScreen = entries[0].isIntersecting;
      sync();
    }, { threshold: 0 }).observe(canvas);
  }

  var rt = 0;
  function onResize() {
    clearTimeout(rt);
    rt = setTimeout(function () {
      stop();
      resize();
      if (!reduced.matches) sync();
    }, 160);
  }
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);

  var btn = document.getElementById("reseed");
  if (btn) {
    btn.addEventListener("click", function () {
      seed = (Math.random() * 0xffff) | 0;
      noise = makeNoise(seed);
      stop();
      ctx.fillStyle = CLEAR;
      ctx.fillRect(0, 0, W, H);
      allocate();
      warm(reduced.matches ? 900 : 480);
      if (!reduced.matches) sync();
    });
  }

  reduced.addEventListener("change", function () {
    stop();
    resize();
    if (!reduced.matches) sync();
  });

  /* ---- go ---- */
  resize();
  if (reduced.matches) {
    if (telF) telF.textContent = "static frame";
  } else {
    sync();
  }
})();
</script>
</body>
</html>
