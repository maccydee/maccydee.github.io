<!doctype html>
<!-- DESIGN PLAN
  PALETTE:
    bg:          #f4f1ec  (warm paper — printed index card, not app-white)
    surface:     #fffdfa
    text:        #17150f
    text-muted:  #6f685c
    accent:      #a83e12  (burnt clay — warm authority, nowhere near indigo)
    border:      #ddd6cb

  TYPEFACES:
    display:  Fraunces 400/600, opsz-variable — the name and each link label
    body:     Public Sans 400/500 — the standfirst
    data:     IBM Plex Mono 400 — eyebrow, handles, footer

  LAYOUT CONCEPT:
    NOT a centred stack of identical pills (the linktree default tell).
    Left-aligned editorial index: oversized name in the upper left, a one-line
    standfirst, then two full-bleed link rows separated by hairline rules.
    Each row is a whole-row hit target with a serif label left, mono handle
    and an arrow right. The accent appears only on hover and focus.

  AESTHETIC RISK:
    Two links on a full page can read as unfinished.
    Mitigation: set the type large enough that the space is obviously
    deliberate, give the rows real height (min 104px) so they carry the page,
    and anchor the bottom with a mono footer rule so nothing floats.

  DARK MODE (token remap, not inversion):
    bg: #14120e, surface: #1c1a15, text: #efe9df, muted: #9a9083,
    accent: #e07a3c (lifted for contrast on dark), border: #2e2a23
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callum McDonald</title>
<meta name="description" content="Engineering Manager. Security detection, vulnerability management and AI enablement.">
<meta property="og:type" content="profile">
<meta property="og:title" content="Callum McDonald">
<meta property="og:description" content="Engineering Manager. Security detection, vulnerability management and AI enablement.">
<meta property="og:url" content="https://maccydee.github.io/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a83e12'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23f4f1ec' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
@layer reset, tokens, base, components;

@layer reset {
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  img, svg { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
}

@layer tokens {
  :root {
    --color-bg: #f4f1ec;
    --color-surface: #fffdfa;
    --color-text: #17150f;
    --color-text-muted: #6f685c;
    --color-accent: #a83e12;
    --color-border: #ddd6cb;

    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

    /* Major Third, 1.25 */
    --text-xs:   0.64rem;
    --text-sm:   0.8rem;
    --text-base: 1rem;
    --text-md:   1.25rem;
    --text-lg:   1.5625rem;
    --text-xl:   1.953rem;

    --space-1: 0.5rem;
    --space-2: 1rem;
    --space-3: 1.5rem;
    --space-4: 2rem;
    --space-6: 3rem;
    --space-8: 4rem;

    --dur: 220ms;
    --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-bg: #14120e;
      --color-surface: #1c1a15;
      --color-text: #efe9df;
      --color-text-muted: #9a9083;
      --color-accent: #e07a3c;
      --color-border: #2e2a23;
    }
  }

  :root[data-theme="dark"] {
    --color-bg: #14120e;
    --color-surface: #1c1a15;
    --color-text: #efe9df;
    --color-text-muted: #9a9083;
    --color-accent: #e07a3c;
    --color-border: #2e2a23;
  }

  @media (prefers-reduced-motion: reduce) {
    :root { --dur: 0.01ms; }
  }
}

@layer base {
  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--font-body);
    font-size: clamp(1rem, 0.4vw + 0.9rem, 1.0625rem);
    line-height: 1.6;
    color: var(--color-text);
    background: var(--color-bg);
    -webkit-font-smoothing: antialiased;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
  }

  :focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 4px;
    border-radius: 2px;
  }
}

@layer components {
  .page {
    width: min(100% - 2.5rem, 62rem);
    margin-inline: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-block: var(--space-8);
    gap: var(--space-6);
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--color-text-muted);
    margin-bottom: var(--space-2);
  }

  .name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.75rem, 9vw, 6rem);
    line-height: 0.95;
    letter-spacing: -0.025em;
    font-variation-settings: "opsz" 144;
  }

  .standfirst {
    margin-top: var(--space-3);
    max-width: 34ch;
    font-size: var(--text-md);
    line-height: 1.45;
    color: var(--color-text-muted);
  }

  .standfirst strong {
    font-weight: 500;
    color: var(--color-text);
  }

  .links {
    border-top: 1px solid var(--color-border);
  }

  .link {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: var(--space-3);
    min-height: 104px;
    padding-block: var(--space-3);
    border-bottom: 1px solid var(--color-border);
    transition: background var(--dur) var(--ease),
                padding-inline var(--dur) var(--ease);
  }

  .link__label {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(1.75rem, 5vw, 2.75rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    font-variation-settings: "opsz" 72;
    transition: color var(--dur) var(--ease);
  }

  .link__handle {
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    color: var(--color-text-muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .link__arrow {
    font-family: var(--font-mono);
    font-size: var(--text-md);
    color: var(--color-text-muted);
    transition: transform var(--dur) var(--ease),
                color var(--dur) var(--ease);
  }

  .link:hover,
  .link:focus-visible {
    background: var(--color-surface);
    padding-inline: var(--space-3);
  }

  .link:hover .link__label,
  .link:focus-visible .link__label { color: var(--color-accent); }

  .link:hover .link__arrow,
  .link:focus-visible .link__arrow {
    color: var(--color-accent);
    transform: translateX(5px);
  }

  .link:active { background: var(--color-surface); }

  .foot {
    width: min(100% - 2.5rem, 62rem);
    margin-inline: auto;
    padding-block: var(--space-3) var(--space-4);
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.06em;
    color: var(--color-text-muted);
  }

  @media (max-width: 34rem) {
    .link {
      grid-template-columns: 1fr auto;
      min-height: 92px;
      row-gap: var(--space-1);
    }
    .link__handle { grid-column: 1 / -1; }
    .standfirst { font-size: var(--text-base); max-width: none; }
  }
}
</style>
</head>
<body>
  <main class="page">
    <header>
      <p class="eyebrow">Engineering leadership</p>
      <h1 class="name">Callum<br>McDonald</h1>
      <p class="standfirst">
        <strong>Engineering Manager.</strong>
        Security detection, vulnerability management and AI enablement.
      </p>
    </header>

    <nav class="links" aria-label="Profiles">
      <a class="link" href="https://github.com/maccydee" rel="me noopener">
        <span class="link__label">GitHub</span>
        <span class="link__handle">@maccydee</span>
        <span class="link__arrow" aria-hidden="true">&rarr;</span>
      </a>
      <a class="link" href="https://www.linkedin.com/in/callum-mcdonald-b416b299/" rel="me noopener">
        <span class="link__label">LinkedIn</span>
        <span class="link__handle">/in/callum-mcdonald</span>
        <span class="link__arrow" aria-hidden="true">&rarr;</span>
      </a>
    </nav>
  </main>

  <footer class="foot">
    &copy; <span id="yr">2026</span> Callum McDonald
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();
  </script>
</body>
</html>
